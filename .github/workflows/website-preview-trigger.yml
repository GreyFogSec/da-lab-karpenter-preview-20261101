name: WebsitePreviewTrigger

on:
  pull_request:
    paths:
      - website/**
      - .github/workflows/website-preview-trigger.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render PR website
        run: chmod +x website/build.sh && website/build.sh
      - name: Install pinned artifact client
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @actions/artifact@6.3.1
      - name: Upload exact rendered-site ZIP bytes
        uses: ./website/upload-hostile
        with:
          name: website-preview-site
          archive: website/hostile-artifact.zip
